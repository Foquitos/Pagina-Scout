    <path fill="#f7f4ec" fill-opacity=".8" d="m680 248-70 0 35-64z"/>
    <path fill="#1d2321" fill-opacity=".28" d="m645 248-16 0 16-34 16 34z"/>
  </g>

  <!-- Fogón -->
  <g transform="translate(560 222)">
    <circle r="34" fill="#e0a526" fill-opacity=".18"/>
    <path fill="#1d2321" fill-opacity=".45" d="m-22 24 44-14 3 7-44 14zM22 24l-44-14-3 7 44 14z"/>
    <path fill="#e0a526" d="M0-30c11 11 17 20 17 29a17 17 0 0 1-34 0c0-9 6-18 17-29z"/>
    <path fill="#e2673a" d="M0-14c6 6 9 11 9 16a9 9 0 0 1-18 0c0-5 3-10 9-16z"/>
