<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Campamento entre montañas">
  <!-- Banda decorativa para las cabeceras. Sin cielo propio: se apoya sobre el
       degradado de la tarjeta, así sirve en cualquier color. -->
  <circle cx="1052" cy="54" r="32" fill="#fff" fill-opacity=".22"/>

  <!-- Montañas lejanas -->
  <path fill="#fff" fill-opacity=".17"
        d="M0 260V168l92-64 70 46 88-72 92 78 78-40 104 56 66-46 100 52 86-58 92 60 104-42 128 44v78z"/>
  <path fill="#fff" fill-opacity=".22"
        d="m250 78 34 29-18 5-16-8-14 9-20-6zM736 68l30 25-16 5-14-7-13 8-18-5z"/>

  <!-- Lomadas -->
  <path fill="#0d3b26" fill-opacity=".16"
        d="M0 260v-58c118-26 214 20 336 0s194 22 320 8 210 24 328 2c78-14 138-8 216-16v64z"/>

  <!-- Bosque -->
  <g fill="#0d3b26" fill-opacity=".3">
    <path d="m70 248-26 0 26-52 26 52zM126 248l-20 0 20-40 20 40zM1044 248l-24 0 24-48 24 48zM1100 248l-18 0 18-36 18 36zM1150 248l-26 0 26-50 26 50zM990 248l-17 0 17-34 17 34z"/>
  </g>
  <g fill="#0d3b26" fill-opacity=".22">
    <path d="m190 250-18 0 18-36 18 36zM930 250l-16 0 16-32 16 32zM252 250l-13 0 13-26 13 26z"/>
  </g>

  <!-- Carpas -->
  <g>
    <path fill="#f7f4ec" fill-opacity=".95" d="m492 248-92 0 46-84z"/>
    <path fill="#1d2321" fill-opacity=".32" d="m446 248-20 0 20-44 20 44z"/>
    <path fill="none" stroke="#f7f4ec" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"
